[workspace]
resolver = "2"
members = ["crates/shop-core", "crates/shop-admin", "crates/shop-customer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
open = "5"
shop-core = { path = "crates/shop-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
